# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS configuration for averylawrence.com/admin.
# How-to for Avery: see CMS-GUIDE.md at the top of this repository.
backend:
  name: github
  repo: averymlawrence/averylawrence-website
  branch: main

site_url: https://averylawrence.com
logo_url: /favicon.svg

# Fallback upload location. Projects and News don't use it: each entry lives in
# its own folder (path: '{{slug}}/index') and its images are stored right
# beside it, which is what the site build expects.
media_folder: site/public/media
public_folder: /media

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: site/src/content/projects
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    slug: '{{title}}'
    summary: '{{order}} — {{title}} ({{status}})'
    sortable_fields: [order, title]
    fields:
      - { label: Title, name: title, widget: string }
      - label: Order
        name: order
        widget: number
        value_type: float
        hint: 'Sorts the home page bar list, smallest first. Any number works, decimals too: 0.5 goes above 1, 4.5 goes between 4 and 5. Bar colors follow the resulting position.'
      - label: Tags
        name: tags
        widget: select
        multiple: true
        required: false
        options: [performance, animation, video, installation, photo]
      - label: Status
        name: status
        widget: select
        options: [ready, coming-soon]
        default: coming-soon
        hint: '"coming-soon" shows the bar with a placeholder page. Switch to "ready" once images and text are in.'
      - label: Hue override
        name: hue
        widget: number
        value_type: int
        required: false
        hint: 'Optional. Leave blank to use the automatic rainbow color; enter 0-360 to pick a hue by hand.'
      - { label: Year, name: year, widget: string, required: false, hint: 'e.g. 2024 or 2019–2023. Shown in the facts line at the top of the project page.' }
      - { label: Medium, name: medium, widget: string, required: false, hint: 'e.g. Wood, rope, metal, electric motor' }
      - { label: Size or duration, name: dimensions, widget: string, required: false, hint: 'e.g. 4 × 5 ft, or 6 min 45 sec' }
      - label: Shown at
        name: shown
        widget: list
        required: false
        hint: 'One entry per exhibition or screening, e.g. "Novella Gallery, Philadelphia, PA (2023)"'
      - { label: Overview, name: overview, widget: text, required: false, hint: 'The project description shown beside the images.' }
      - label: Who helped
        name: credits
        widget: list
        required: false
        hint: 'One entry per person, e.g. "Ross McDermott — direction, camera, editing"'
      - label: Video path
        name: video
        widget: string
        required: false
        hint: 'Rarely needed. Only for a video file already in the site, e.g. /media/the-weather/clip.mp4'
      - { label: Video caption, name: video_caption, widget: text, required: false }
      - label: Images
        name: images
        widget: list
        required: false
        summary: '{{alt}}'
        fields:
          - { label: Image, name: src, widget: image }
          - { label: Alt text, name: alt, widget: string, hint: 'Short (about 20 words). Read aloud by screen readers.' }
          - { label: Image description, name: caption, widget: text, required: false, hint: 'Long description (about 200 words). Shown under "image description".' }
      - label: Comments
        name: comments
        widget: list
        required: false
        summary: '{{name}}: {{text}}'
        hint: 'The fake comment thread shown at the bottom of the project page. Leave empty for no comments section.'
        fields:
          - { label: Commenter name, name: name, widget: string }
          - { label: Comment, name: text, widget: text }
          - { label: Thumbs up, name: likes, widget: number, value_type: int, required: false }
          - { label: Thumbs down, name: dislikes, widget: number, value_type: int, required: false }
          - { label: When, name: when, widget: string, required: false, hint: 'Free text, e.g. "3 years ago"' }
          - { label: Is a reply, name: reply, widget: boolean, default: false, hint: 'Indents the comment under the one above it.' }

  - name: news
    label: News
    label_singular: Post
    folder: site/src/content/news
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{date}} — {{title}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - label: Images
        name: images
        widget: list
        required: false
        summary: '{{alt}}'
        fields:
          - { label: Image, name: src, widget: image }
          - { label: Alt text, name: alt, widget: string }
          - { label: Image description, name: caption, widget: text, required: false }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: courses
    label: Courses
    label_singular: Course
    folder: site/src/content/courses
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    slug: '{{title}}'
    summary: '{{title}} — {{school}}'
    fields:
      - { label: Course title, name: title, widget: string }
      - { label: School, name: school, widget: string, hint: 'e.g. University of Michigan, Stamps School of Art & Design' }
      - { label: Years, name: years, widget: string, required: false, hint: 'e.g. 2024–present' }
      - { label: Order, name: order, widget: number, value_type: float, hint: 'Sorts the teaching page, smallest first.' }
      - { label: Description, name: description, widget: text, required: false }

  - name: studentwork
    label: Student work
    label_singular: Set of student work
    folder: site/src/content/studentwork
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    slug: '{{course}}-{{assignment}}-{{term}}'
    summary: '{{assignment}} — {{term}}'
    fields:
      - label: Course
        name: course
        widget: relation
        collection: courses
        value_field: '{{slug}}'
        display_fields: [title]
        search_fields: [title]
      - { label: Assignment, name: assignment, widget: string, hint: 'Sets with the same assignment name are grouped under one heading on the course page.' }
      - { label: Assignment description, name: assignment_description, widget: text, required: false }
      - { label: Term, name: term, widget: string, hint: 'e.g. Fall 2025' }
      - { label: Sort number, name: sort, widget: number, value_type: float, hint: 'Newest shows first. Use the year, plus .5 for fall: Winter 2026 = 2026, Fall 2026 = 2026.5' }
      - label: Works
        name: works
        widget: list
        summary: '{{student}}'
        fields:
          - { label: Student, name: student, widget: string, hint: 'First name and last initial, e.g. Isha B.' }
          - { label: Title, name: title, widget: string, required: false }
          - { label: Vimeo or YouTube link, name: embed, widget: string, required: false, hint: 'Paste the normal page link. Use this for animation and video.' }
          - { label: Image, name: image, widget: image, required: false, hint: 'For still work. Leave blank if you pasted a video link.' }
          - { label: Alt text, name: alt, widget: string, required: false }
